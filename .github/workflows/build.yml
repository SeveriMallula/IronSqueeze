name: Sound Imager installers
on:
  push:
    branches: [build/sound-imager]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    name: Windows x64 VST3 and installer
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and package
        shell: cmd
        run: build_windows.bat
      - name: Render interface
        shell: pwsh
        run: ./build/Release/imager_processor_tests.exe dist/SoundImager_GUI.png
      - name: Hash installer
        shell: pwsh
        run: Get-FileHash dist/*.exe -Algorithm SHA256 | Format-List | Out-File dist/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SoundImager-0.1.0-Windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
  macos:
    if: ${{ !contains(github.event.head_commit.message, '[windows-only]') }}
    name: macOS universal VST3 AU and installer
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and package
        run: bash build_macos.sh
      - name: Validate AU and package contents
        run: |
          sudo installer -pkg dist/SoundImager-0.1.0-macOS.pkg -target /
          plutil -p "/Library/Audio/Plug-Ins/Components/Sound Imager.component/Contents/Info.plist"
          sudo killall AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -a
          auval -v aufx SoIm Mllu
          pkgutil --payload-files dist/SoundImager-0.1.0-macOS.pkg
          lipo -info "/Library/Audio/Plug-Ins/Components/Sound Imager.component/Contents/MacOS/Sound Imager"
          lipo -info "/Library/Audio/Plug-Ins/VST3/Sound Imager.vst3/Contents/MacOS/Sound Imager"
          codesign --verify --deep --strict "/Library/Audio/Plug-Ins/Components/Sound Imager.component"
          codesign --verify --deep --strict "/Library/Audio/Plug-Ins/VST3/Sound Imager.vst3"
          shasum -a 256 dist/*.pkg > dist/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SoundImager-0.1.0-macOS-universal
          path: dist/*
          if-no-files-found: error
          retention-days: 30
